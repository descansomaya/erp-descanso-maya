<!-- Estabilizador de Pedidos: se ejecuta despues del fix historico para impedir ciclos de render. -->
<script>
(function () {
    const norm = v => String(v || '').toLowerCase().trim();
    const inactivo = p => ['cancelado', 'devuelto'].includes(norm(p?.estado));
    const ventaValida = p => !!p && String(p.cliente_id || '').toUpperCase() !== 'STOCK_INTERNO' && !inactivo(p);

    window.DM = window.DM || {};
    DM.esVentaValida = ventaValida;
    DM.ventasValidas = lista => (lista || []).filter(ventaValida);

    const pedidosOriginal = App.views.pedidos;
    if (typeof pedidosOriginal === 'function') {
        App.views.pedidos = function () {
            const todos = App.state?.pedidos || [];
            const activos = todos.filter(p => !inactivo(p));
            const historico = !!App.state?.mostrarHistoricoPedidos;
            const anterior = App.state.pedidos;
            App.state.pedidos = historico ? todos : activos;
            let html;
            try { html = pedidosOriginal.apply(this, arguments); }
            finally { App.state.pedidos = anterior; }

            html = html.replace(/📜 Histórico Completos \(\d+\)/g, `📜 Histórico Completos (${todos.length})`);
            html = html.replace(/📦 Ver Solo Activos \(\d+\)/g, `📦 Ver Solo Activos (${activos.length})`);
            html = html.replace(/style="background:var\(--dm-muted\); color:white;">cancelado/g, 'style="background:#dc2626; color:white;">cancelado');
            html = html.replace(/style="background:var\(--dm-muted\); color:white;">devuelto/g, 'style="background:#f59e0b; color:white;">devuelto');
            return html;
        };
    }

    const inicioOriginal = App.views.inicio;
    if (typeof inicioOriginal === 'function') {
        App.views.inicio = function () {
            let html = inicioOriginal.apply(this, arguments);
            const hoy = new Date();
            const ventas = (App.state?.pedidos || []).filter(ventaValida).filter(p => {
                const f = new Date(p.fecha_creacion || p.fecha || p.created_at || '');
                return !Number.isNaN(f.getTime()) && f.getMonth() === hoy.getMonth() && f.getFullYear() === hoy.getFullYear();
            }).reduce((s, p) => s + (parseFloat(p.total || 0) || 0), 0);
            const activos = (App.state?.pedidos || []).filter(p => !inactivo(p) && !['entregado','pagado'].includes(norm(p.estado))).length;
            html = html.replace(/(Ventas del mes<\/small>\s*<div[^>]*>)[\s\S]*?(<\/div>)/, `$1${App.ui.money(ventas)}$2`);
            html = html.replace(/(Pedidos activos<\/small>\s*<div[^>]*>)[\s\S]*?(<\/div>)/, `$1${activos}$2`);
            return html;
        };
    }

    function desconectar() {
        ['app-content', 'sheet-content'].forEach(id => {
            const root = document.getElementById(id);
            if (!root) return;
            try {
                root.__dmFix2Observer?.disconnect();
                root.__dmFix2DashObserver?.disconnect();
                root.__dmFix2SheetObserver?.disconnect();
            } catch (e) {}
            if (root.__dmFix2Timer) clearTimeout(root.__dmFix2Timer);
            if (root.__dmFix2DashTimer) clearTimeout(root.__dmFix2DashTimer);
            delete root.__dmFix2Observer;
            delete root.__dmFix2DashObserver;
            delete root.__dmFix2SheetObserver;
            root.querySelectorAll('[data-dm-estado-pedido]').forEach(el => el.remove());
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', desconectar, { once: true });
    else desconectar();
})();
</script>
